<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bili 推流管理</title>
<style>
/* Material 3 Expressive — hand-rolled, no external deps */
:root{
  --seed:#7c4dff;
  --primary:#6750a4; --on-primary:#fff;
  --primary-container:#eaddff; --on-primary-container:#21005d;
  --secondary-container:#e8def8; --on-secondary-container:#1d192b;
  --tertiary-container:#ffd8e4; --on-tertiary-container:#31111d;
  --success-container:#d4edda; --on-success-container:#0f3d1e;
  --surface:#fef7ff; --surface-container-low:#f7f2fa; --surface-container:#f3edf7;
  --surface-container-high:#ece6f0; --surface-container-highest:#e6e0e9;
  --on-surface:#1d1b20; --on-surface-variant:#49454f;
  --outline:#79747e; --outline-variant:#cac4d0;
  --error:#b3261e; --on-error:#fff; --error-container:#f9dedc;
  --shadow:0 1px 2px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.12);
  --shadow-2:0 2px 6px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.14);
  --r-lg:28px; --r-md:20px; --r-sm:16px; --r-xs:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --primary:#d0bcff; --on-primary:#381e72;
    --primary-container:#4f378b; --on-primary-container:#eaddff;
    --secondary-container:#4a4458; --on-secondary-container:#e8def8;
    --tertiary-container:#633b48; --on-tertiary-container:#ffd8e4;
    --success-container:#144d28; --on-success-container:#c4f0cd;
    --surface:#141218; --surface-container-low:#1d1b20; --surface-container:#211f26;
    --surface-container-high:#2b2930; --surface-container-highest:#36343b;
    --on-surface:#e6e0e9; --on-surface-variant:#cac4d0;
    --outline:#938f99; --outline-variant:#49454f;
    --error:#f2b8b5; --on-error:#601410; --error-container:#8c1d18;
  }
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  margin:0;color:var(--on-surface);
  background:linear-gradient(180deg,var(--primary-container) 0,var(--surface) 320px);
  min-height:100vh}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:14px 20px;background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--outline-variant)}
.topbar .logo{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow)}
.topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
.topbar .sub{font-size:12px;color:var(--on-surface-variant)}
.topbar .spacer{flex:1}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface-container-low);border-radius:var(--r-lg);padding:20px;
  box-shadow:var(--shadow);border:1px solid transparent}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--on-surface-variant);
  text-transform:uppercase;letter-spacing:1.2px;display:flex;align-items:center;gap:8px}
.card h2 svg{flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row:last-child{margin-bottom:0}
.mode-hero{display:flex;align-items:center;gap:14px;background:var(--surface-container);
  border-radius:var(--r-md);padding:14px 16px}
.mode-dot{width:14px;height:14px;border-radius:50%;background:var(--outline);flex:none}
.mode-dot.on{background:#2e7d32;box-shadow:0 0 0 6px color-mix(in srgb,#2e7d32 22%,transparent);animation:pulse 1.6s infinite}
.mode-dot.warn{background:#b26a00;box-shadow:0 0 0 6px color-mix(in srgb,#b26a00 22%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
.mode-name{font-size:22px;font-weight:800}
.mode-hint{font-size:12px;color:var(--on-surface-variant)}
.svc{flex:1;min-width:220px;background:var(--surface-container-high);border-radius:var(--r-md);padding:12px 14px}
.svc .t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.svc .s{font-size:12px;color:var(--on-surface-variant);margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--surface-container-highest);color:var(--on-surface-variant)}
.pill.live{background:var(--success-container);color:var(--on-success-container)}
.pill.bad{background:var(--error-container);color:var(--error)}
.field{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--on-surface-variant);font-weight:600}
.field input,.field textarea,.field select{font:inherit;font-size:14px;color:var(--on-surface);
  background:var(--surface-container-high);border:1px solid transparent;border-bottom:2px solid var(--outline-variant);
  border-radius:var(--r-xs) var(--r-xs) 0 0;padding:12px 14px;outline:none;width:100%}
.field input:focus,.field textarea:focus{border-bottom-color:var(--primary);background:var(--surface-container-highest)}
.field textarea{resize:vertical}
select.field-sel{font:inherit;font-size:14px;color:var(--on-surface);background:var(--surface-container-high);
  border:none;border-radius:999px;padding:10px 16px;outline:none}
button{font:inherit;font-size:14px;font-weight:700;border:none;cursor:pointer;
  border-radius:999px;padding:11px 22px;display:inline-flex;align-items:center;gap:8px;
  transition:transform .12s ease,box-shadow .12s ease,opacity .12s}
button:active{transform:scale(.96)}
button:disabled{opacity:.55;cursor:wait}
.btn-fill{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow)}
.btn-fill:hover{box-shadow:var(--shadow-2)}
.btn-tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn-danger{background:var(--error-container);color:var(--error)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--outline)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-surface-variant)}
.check input{width:18px;height:18px;accent-color:var(--primary)}
pre{background:var(--surface-container-high);color:var(--on-surface);border-radius:var(--r-md);
  padding:14px 16px;overflow:auto;max-height:320px;font-size:12px;line-height:1.6;
  white-space:pre-wrap;margin:10px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.progress{height:4px;border-radius:999px;overflow:hidden;background:var(--surface-container-highest);
  opacity:0;transition:opacity .2s}
.progress.show{opacity:1}
.progress i{display:block;height:100%;width:40%;border-radius:999px;background:var(--primary);animation:slide 1.1s infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
#snack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);z-index:9;
  background:var(--on-surface);color:var(--surface);border-radius:var(--r-sm);padding:13px 20px;
  font-size:14px;max-width:min(92vw,560px);box-shadow:var(--shadow-2);opacity:0;transition:all .25s}
#snack.show{transform:translateX(-50%) translateY(0);opacity:1}
#snack.err{background:var(--error);color:var(--on-error)}
.foot{text-align:center;font-size:12px;color:var(--on-surface-variant)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
  </div>
  <div><h1>Bili 推流管理</h1><div class="sub">TikTok 转播 · 文件轮播 · B 站房间</div></div>
  <div class="spacer"></div>
  <button class="btn-tonal" onclick="load()" id="btnRefresh" title="刷新状态">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08a6 6 0 1 1-1.41-6.24L13 11h7V4l-2.35 2.35z"/></svg>
    刷新</button>
</div>

<div class="wrap">
  <div class="progress" id="bar"><i></i></div>

  <div class="card">
    <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 14.5v-9l7.5 4.5-7.5 4.5z"/></svg>当前状态</h2>
    <div class="mode-hero">
      <span class="mode-dot" id="modeDot"></span>
      <div><div class="mode-name" id="mode">…</div><div class="mode-hint">每 10 秒自动刷新</div></div>
    </div>
    <div class="row">
      <div class="svc"><div class="t">直播推流 <span class="pill" id="livePill">…</span></div>
        <div class="s" id="liveState">…</div><div class="s" id="liveTarget"></div></div>
      <div class="svc"><div class="t">文件轮播 <span class="pill" id="replayPill">…</span></div>
        <div class="s" id="replayState">…</div><div class="s" id="replayArgs"></div></div>
    </div>
    <pre id="room">房间状态加载中…</pre>
  </div>

  <div class="card">
    <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.75 15.02 15.5 12l-5.75-3.02v6.04zM18 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3zm1 15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12z"/></svg>直播推流</h2>
    <div class="row">
      <div class="field"><label>TikTok 用户名</label>
        <input id="target" type="text" placeholder="如 ayakiguchi1"></div>
      <button class="btn-fill" id="btnLive" onclick="goMode('live')">启动直播推流</button>
    </div>
    <div class="row">
      <label class="check"><input id="forceLive" type="checkbox"> 没开播也切换（空等复播，每 60 秒重试）</label>
    </div>
    <div class="mode-hint">先验流再切换：目标没在播会拒绝，保持原推流不动。勾选上项则跳过验流直接切换，服务空等复播自动转推。</div>
  </div>

  <div class="card">
    <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm1 2v8h14V8H5zm3 2v4l3.5-2L8 10z"/></svg>文件轮播</h2>
    <div class="row"><div class="field"><label>绝对路径，每行一个文件或目录（目录取其中 *.mp4）</label>
      <textarea id="paths" rows="3"></textarea></div></div>
    <div class="row">
      <label class="check"><input id="encode" type="checkbox"> --encode 重编码（跨分段卡顿时用；默认 -c copy）</label>
      <button class="btn-tonal" id="btnReplay" onclick="goMode('replay')">启动文件轮播</button>
    </div>
    <div class="mode-hint">房间关播时自动用上次分区/标题开播；无开播记录时需先去房间卡开播。</div>
  </div>

  <div class="card">
    <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 8.5V9h20v-.5L12 3zM5 10v8H3v3h18v-3h-2v-8h-3v8h-3v-8h-3v8H7v-8H5z"/></svg>房间</h2>
    <div class="row">
      <div class="field" style="max-width:190px"><label>子分区 ID</label>
        <input id="area" type="number" placeholder="live.py areas 查"></div>
      <div class="field"><label>标题（纯文本，禁 emoji，≤40 字）</label>
        <input id="title" type="text"></div>
      <button class="btn-fill" id="btnStart" onclick="goRoom('start')">开播</button>
    </div>
    <div class="row">
      <div class="field"><label>新标题</label><input id="newTitle" type="text"></div>
      <button class="btn-tonal" id="btnUpdate" onclick="goRoom('update')">改标题</button>
      <button class="btn-danger" id="btnStop" onclick="goRoom('stop')">停播（同时停推流）</button>
    </div>
    <pre id="roomOut" hidden></pre>
  </div>

  <div class="card">
    <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H8l-5 4V6a1 1 0 0 1 1-1zm2 3v2h12V8H6zm0 4v2h8v-2H6z"/></svg>日志</h2>
    <div class="row">
      <select id="which" class="field-sel">
        <option value="live">直播推流</option><option value="replay">文件轮播</option><option value="webui">webui</option>
      </select>
      <button class="btn-tonal" id="btnLogs" onclick="logs()">查看</button>
      <div class="spacer" style="flex:1"></div>
      <button class="btn-outline" id="btnStopAll" onclick="stopAll()">停止全部推流</button>
    </div>
    <pre id="logOut" hidden></pre>
  </div>

  <div class="foot">BiliPushWebUI · 仅监听回环地址</div>
</div>

<div id="snack"></div>

<script>
let busy = 0;
function setBusy(on){
  busy += on ? 1 : -1;
  if(busy < 0) busy = 0;
  document.getElementById('bar').className = 'progress' + (busy ? ' show' : '');
  for(const id of ['btnLive','btnReplay','btnStart','btnUpdate','btnStop','btnLogs','btnStopAll','btnRefresh','forceLive'])
    document.getElementById(id).disabled = !!busy;
}
async function api(path, data){
  setBusy(true);
  try{
    const o = data ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)} : {};
    const r = await fetch(path, o);
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || r.status);
    return j;
  }finally{ setBusy(false); }
}
let snackT = null;
function snack(msg, isErr){
  const el = document.getElementById('snack');
  el.textContent = msg; el.className = isErr ? 'err' : '';
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(snackT);
  snackT = setTimeout(() => el.classList.remove('show'), isErr ? 8000 : 4000);
}
function showErr(e){ snack('错误：' + e.message, true); }
function pill(el, text, cls){ const p = document.getElementById(el); p.textContent = text; p.className = 'pill' + (cls ? ' ' + cls : ''); }
function unitLine(u){
  return `${u.active}/${u.sub}${u.pid ? ' pid=' + u.pid : ''}${u.pushing ? ' · 推流中' : ''}`;
}
async function load(){
  try{
    const s = await api('/api/status');
    const names = {live:'直播推流', replay:'文件轮播', idle:'空闲', conflict:'冲突！双推流'};
    document.getElementById('mode').textContent = names[s.mode] || s.mode;
    document.getElementById('modeDot').className = 'mode-dot' + (s.mode === 'idle' ? '' : s.mode === 'conflict' ? ' warn' : ' on');
    document.getElementById('liveState').textContent = unitLine(s.live);
    document.getElementById('liveTarget').textContent = s.live.target ? '目标 @' + s.live.target : '';
    document.getElementById('replayState').textContent = unitLine(s.replay);
    document.getElementById('replayArgs').textContent = s.replay.args || '';
    pill('livePill', s.live.pushing ? '推流中' : s.live.active === 'active' ? '待命' : '停止', s.live.pushing ? 'live' : s.live.active === 'active' ? '' : 'bad');
    pill('replayPill', s.replay.pushing ? '推流中' : s.replay.active === 'active' ? '待命' : '停止', s.replay.pushing ? 'live' : s.replay.active === 'active' ? '' : 'bad');
    document.getElementById('room').textContent = s.room.text || '(房间状态未知)';
  }catch(e){ showErr(e); }
}
async function goMode(mode){
  try{
    const data = {mode};
    if(mode === 'live'){
      data.target = document.getElementById('target').value.trim();
      data.force = document.getElementById('forceLive').checked;
      if(!data.target){ showErr(new Error('请填写 TikTok 用户名')); return; }
      snack(data.force ? '跳过验流，直接切换（空等复播）…' : '正在验证 @' + data.target + ' 的直播流（≤45s），拿到地址才切换…');
    }else{
      data.paths = document.getElementById('paths').value.split('\n').map(s => s.trim()).filter(Boolean);
      data.encode = document.getElementById('encode').checked;
    }
    await api('/api/mode', data);
    snack(mode === 'live' ? '已切换到直播推流' : '已切换到文件轮播');
    await load();
  }catch(e){ showErr(e); }
}
async function goRoom(action){
  try{
    const data = {action};
    if(action === 'start'){
      data.area = parseInt(document.getElementById('area').value, 10);
      data.title = document.getElementById('title').value.trim();
    }else if(action === 'update'){
      data.title = document.getElementById('newTitle').value.trim();
    }
    if(action === 'start') snack('开播中（换推流码并重启推流，大约需要半分钟）…');
    const r = await api('/api/room', data);
    const out = document.getElementById('roomOut');
    out.hidden = false; out.textContent = r.output || 'OK';
    snack(action === 'start' ? '开播成功，推流已用新码重启' : 'OK');
    await load();
  }catch(e){ showErr(e); }
}
async function stopAll(){ try{ await api('/api/stop', {}); snack('已停止全部推流'); await load(); }catch(e){ showErr(e); } }
async function logs(){
  try{
    const w = document.getElementById('which').value;
    const r = await api('/api/logs?which=' + w + '&tail=150');
    const out = document.getElementById('logOut');
    out.hidden = false; out.textContent = r.logs || '(空)';
  }catch(e){ showErr(e); }
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
